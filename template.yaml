AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Emergency Passport System - Serverless backend providing rapid emergency medical
  profiles and nearby hospital routing for tourists and first responders.

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: python3.12
    LoggingConfig:
      LogFormat: JSON

Parameters:
  TouristProfilesTableName:
    Type: String
    Default: TouristProfiles
    Description: Name of the DynamoDB table storing tourist emergency medical profiles.
  HospitalsTableName:
    Type: String
    Default: Hospitals
    Description: Name of the DynamoDB table storing verified hospital directory and capacity info.

Resources:
  # ============================================================================
  # DynamoDB Tables (On-Demand / Pay-Per-Request Billing)
  # ============================================================================
  TouristProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TouristProfilesTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: TouristID
          AttributeType: S
      KeySchema:
        - AttributeName: TouristID
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: EmergencyPassport
        - Key: Environment
          Value: Dev

  HospitalsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref HospitalsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: HospitalID
          AttributeType: S
      KeySchema:
        - AttributeName: HospitalID
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: EmergencyPassport
        - Key: Environment
          Value: Dev

  # ============================================================================
  # API Gateway HTTP API
  # ============================================================================
  EmergencyHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: HTTP API for Emergency Passport access and first responder lookup
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Amz-Date
          - X-Api-Key
          - X-Amz-Security-Token
        AllowOrigins:
          - "*"

  # ============================================================================
  # Lambda Functions (Least Privilege Access)
  # ============================================================================
  EmergencyHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: EmergencyHandler
      CodeUri: src/emergency_handler/
      Handler: app.lambda_handler
      Description: Placeholder entrypoint for emergency passport triage and lookup
      Environment:
        Variables:
          TOURIST_PROFILES_TABLE: !Ref TouristProfilesTable
          HOSPITALS_TABLE: !Ref HospitalsTable
      # Least privilege IAM permissions: scoped strictly to CRUD on the two DynamoDB tables
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TouristProfilesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref HospitalsTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
      Events:
        HealthCheck:
          Type: HttpApi
          Properties:
            ApiId: !Ref EmergencyHttpApi
            Path: /health
            Method: GET
        EmergencyGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref EmergencyHttpApi
            Path: /emergency
            Method: GET
        EmergencyPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref EmergencyHttpApi
            Path: /emergency
            Method: POST
        TouristsList:
          Type: HttpApi
          Properties:
            ApiId: !Ref EmergencyHttpApi
            Path: /tourists
            Method: GET
        TouristCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref EmergencyHttpApi
            Path: /tourists
            Method: POST
        TouristLookup:
          Type: HttpApi
          Properties:
            ApiId: !Ref EmergencyHttpApi
            Path: /tourists/{tourist_id}
            Method: GET
        TouristQr:
          Type: HttpApi
          Properties:
            ApiId: !Ref EmergencyHttpApi
            Path: /tourists/{tourist_id}/qr
            Method: GET
        TouristUpdate:
          Type: HttpApi
          Properties:
            ApiId: !Ref EmergencyHttpApi
            Path: /tourists/{tourist_id}
            Method: PUT
        TouristDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref EmergencyHttpApi
            Path: /tourists/{tourist_id}
            Method: DELETE
        HospitalsList:
          Type: HttpApi
          Properties:
            ApiId: !Ref EmergencyHttpApi
            Path: /hospitals
            Method: GET
        HospitalLookup:
          Type: HttpApi
          Properties:
            ApiId: !Ref EmergencyHttpApi
            Path: /hospitals/{hospital_id}
            Method: GET
        HospitalCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref EmergencyHttpApi
            Path: /hospitals
            Method: POST
        AlertsList:
          Type: HttpApi
          Properties:
            ApiId: !Ref EmergencyHttpApi
            Path: /alerts
            Method: GET
      Tags:
        Project: EmergencyPassport

  # ============================================================================
  # S3 Bucket for Static Frontend (100% Private, Encrypted at Rest)
  # ============================================================================
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: EmergencyPassport
        - Key: Environment
          Value: Dev

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${EmergencyCloudFrontDistribution}"

  # ============================================================================
  # CloudFront Origin Access Control (OAC) & Response Security Headers
  # ============================================================================
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-OAC"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontSecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-SecurityHeadersPolicy"
        Comment: "Strict security headers: HSTS, nosniff, frame-deny, xss-protection"
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          XSSProtection:
            ModeBlock: true
            Protection: true
            Override: true

  # ============================================================================
  # CloudFront CDN (HTTPS Enforcement & Edge Routing)
  # ============================================================================
  EmergencyCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Emergency Passport - Global Edge HTTPS Distribution
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: S3FrontendOrigin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig: {}
          - Id: ApiGatewayOrigin
            DomainName: !Sub "${EmergencyHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: S3FrontendOrigin
          ViewerProtocolPolicy: redirect-to-https
          ResponseHeadersPolicyId: !Ref CloudFrontSecurityHeadersPolicy
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          Compress: true
        CacheBehaviors:
          - PathPattern: /emergency*
            TargetOriginId: ApiGatewayOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: !Ref CloudFrontSecurityHeadersPolicy
            Compress: true
          - PathPattern: /tourists*
            TargetOriginId: ApiGatewayOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: !Ref CloudFrontSecurityHeadersPolicy
            Compress: true
          - PathPattern: /hospitals*
            TargetOriginId: ApiGatewayOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: !Ref CloudFrontSecurityHeadersPolicy
            Compress: true
          - PathPattern: /health*
            TargetOriginId: ApiGatewayOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: !Ref CloudFrontSecurityHeadersPolicy
            Compress: true
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
      Tags:
        - Key: Project
          Value: EmergencyPassport

# ============================================================================
# Stack Outputs
# ============================================================================
Outputs:
  SecureWebsiteHttpsUrl:
    Description: Global HTTPS Website URL powered by Amazon CloudFront (100% HTTPS enforced)
    Value: !Sub "https://${EmergencyCloudFrontDistribution.DomainName}"
    Export:
      Name: EmergencyPassportSecureHttpsUrl

  CloudFrontDistributionId:
    Description: CloudFront Distribution ID
    Value: !Ref EmergencyCloudFrontDistribution

  FrontendS3Bucket:
    Description: Private S3 Bucket for Frontend Assets
    Value: !Ref FrontendBucket

  HttpApiEndpoint:
    Description: Base HTTP API endpoint URL for Emergency Passport service
    Value: !Sub "https://${EmergencyHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
    Export:
      Name: EmergencyPassportHttpApiEndpoint

  EmergencyHandlerFunctionArn:
    Description: Lambda Function ARN for EmergencyHandler
    Value: !GetAtt EmergencyHandlerFunction.Arn

  TouristProfilesTableName:
    Description: DynamoDB Table Name for Tourist Profiles
    Value: !Ref TouristProfilesTable

  TouristProfilesTableArn:
    Description: DynamoDB Table ARN for Tourist Profiles
    Value: !GetAtt TouristProfilesTable.Arn

  HospitalsTableName:
    Description: DynamoDB Table Name for Hospitals Directory
    Value: !Ref HospitalsTable

  HospitalsTableArn:
    Description: DynamoDB Table ARN for Hospitals Directory
    Value: !GetAtt HospitalsTable.Arn
